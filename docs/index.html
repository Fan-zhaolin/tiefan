<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>铁与饭</title>
    <style>:root {
  color-scheme: light;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #302e29;
  background: #f7f5f0;
  font-synthesis: none;
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
body { margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
button:focus-visible, input:focus-visible { outline: 1px solid #777268; outline-offset: 4px; }
[hidden] { display: none !important; }
.ledger { max-width: 760px; min-height: 100svh; margin: 0 auto; padding: 0 30px; }
.input-bar { position: sticky; top: 0; z-index: 1; padding-top: 28px; background: #f7f5f0; border-bottom: 1px solid #d8d4ca; }
.heading { display: flex; align-items: baseline; gap: 18px; }
h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: 0.08em; }
#date, .muted { color: #777268; }
#date { font-size: 12px; }
#settings-toggle { margin-left: auto; padding: 8px 0 8px 12px; color: #777268; font-size: 12px; }
#settings { padding: 12px 0; }
#settings button { padding: 7px 18px; border: 1px solid #d8d4ca; }
#meal-input { width: 100%; padding: 24px 0; font-size: 20px; line-height: 1.5; border: 0; border-radius: 0; background: transparent; }
#meal-input::placeholder { color: #8b8579; }
#meal-input:focus-visible { outline-offset: -4px; }
#input-message { margin: 0 0 16px; font-size: 13px; overflow-wrap: anywhere; }
main { padding-bottom: 160px; }
#timeline { list-style: none; margin: 0; padding: 0; }
.entry { padding: 22px 0; border-bottom: 1px solid #e4e0d7; }
.source { margin: 0 0 12px; color: #777268; font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; }
.food-row { display: grid; grid-template-columns: 4rem minmax(0, 1fr) 5rem 6rem 9rem; align-items: baseline; gap: 10px; padding: 7px 0; font-size: 14px; line-height: 1.6; }
.food-row time { color: #777268; font-size: 12px; font-variant-numeric: tabular-nums; }
.food-name { overflow-wrap: anywhere; }
.portion { font-size: 12px; color: #777268; }
.kcal { text-align: right; font-variant-numeric: tabular-nums; }
.macros { font-size: 11px; color: #777268; white-space: nowrap; }
.portion-question { margin: 12px 0 8px 74px; padding-left: 14px; border-left: 1px solid #d8d4ca; font-size: 13px; }
.portion-question p { margin: 0 0 10px; }
.portion-question .range { font-size: 16px; font-variant-numeric: tabular-nums; }
.portion-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.portion-actions button { padding: 7px 12px; border: 1px solid #d8d4ca; }
.portion-actions .leave { color: #777268; border-color: transparent; }
.empty { margin: 40px 0; font-size: 13px; }
.daily-footer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(760px, 100%); padding: 20px 30px max(18px, env(safe-area-inset-bottom)); background: #f7f5f0; border-top: 1px solid #d8d4ca; }
.total-line { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
#total-label { font-size: 14px; }
#total { font-size: 23px; font-variant-numeric: tabular-nums; }
.total-line.unavailable #total { font-size: 16px; line-height: 1.6; }
#skip-today { display: block; margin: 18px auto 0; padding: 7px 18px; color: #777268; font-size: 13px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
@media (max-width: 580px) {
  .ledger { padding: 0 20px; }
  .input-bar { padding-top: 18px; }
  #meal-input { font-size: 18px; }
  .food-row { grid-template-columns: 3rem minmax(0, 1fr) 3.5rem 4.5rem; gap: 8px; }
  .macros { grid-column: 2 / -1; }
  .portion-question { margin-left: 56px; }
  .daily-footer { padding-left: 20px; padding-right: 20px; }
}
</style>
  </head>
  <body>
    <div class="ledger">
      <header class="input-bar">
        <div class="heading">
          <h1>铁与饭</h1>
          <span id="date"></span>
          <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings">设置</button>
        </div>
        <div id="settings" hidden><button id="export" type="button">导出</button></div>
        <form id="meal-form" autocomplete="off">
          <label class="visually-hidden" for="meal-input">吃了什么</label>
          <input id="meal-input" name="meal" type="text" enterkeyhint="done" placeholder="中午吃了什么…">
        </form>
        <p id="input-message" class="muted" hidden></p>
      </header>
      <main>
        <ol id="timeline" aria-label="今天的饮食"></ol>
        <p id="empty" class="empty muted">今天还没记</p>
      </main>
      <footer class="daily-footer">
        <div class="total-line"><span id="total-label">今天</span><output id="total">—</output></div>
        <button id="skip-today" type="button">今天不记</button>
      </footer>
    </div>
