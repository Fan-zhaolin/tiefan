name: 数据校验

on:
  pull_request:
    paths:
      - 'packages/data/**'
      - 'tests/fixtures/**'
      - '.github/workflows/data.yml'

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meal/data typecheck
      - run: pnpm validate
      - run: pnpm exec vitest run packages/data tests/acceptance.test.ts
