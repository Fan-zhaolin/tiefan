# ---------- A. 食材 + 重量（精确路径） ----------
- id: "01"
  input: "鸡胸200g 米饭一碗"
  expect:
    foods: [ 鸡胸, 米饭 ]
    must_be_exact: [ 鸡胸 ]
    unresolved: 0

- id: "02"
  input: "早上两个鸡蛋一杯牛奶"
  expect:
    foods: [ 鸡蛋, 牛奶 ]
    unresolved: 0

- id: "03"
  input: "鸡胸两百克"
  expect:
    foods: [ 鸡胸 ]
    must_be_exact: [ 鸡胸 ]
    unresolved: 0

- id: "04"
  input: "二两牛肉"
  expect:
    foods: [ 牛肉 ]
    must_be_exact: [ 牛肉 ]

- id: "05"
  input: "半斤虾"
  expect:
    foods: [ 虾 ]
    must_be_exact: [ 虾 ]

- id: "06"
  input: "0.2kg鸡胸"
  expect:
    foods: [ 鸡胸 ]
    must_be_exact: [ 鸡胸 ]

- id: "07"
  input: "鸡胸200"
  expect:
    foods: [ 鸡胸 ]
    must_be_exact: [ 鸡胸 ] # 裸数字默认克

- id: "08"
  input: "鸡蛋2个"
  expect:
    foods: [ 鸡蛋 ]
    must_be_exact: [ 鸡蛋 ] # 依赖 Dish 提供「个 = 50g」

